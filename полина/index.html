
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Polina ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #090609;
    color: white;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 40%, #50102c55, transparent 65%),
        radial-gradient(circle at 10% 90%, #8b174422, transparent 40%);
    pointer-events: none;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.star {
    position: absolute;
    color: #ff8cba;
    animation: twinkle 2s infinite alternate;
    text-shadow: 0 0 12px #ff4b98;
}

@keyframes twinkle {
    from { opacity: .15; transform: scale(.7); }
    to { opacity: 1; transform: scale(1.3); }
}

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 45px 20px;
    text-align: center;
}

.top-label {
    color: #ff83b4;
    letter-spacing: 6px;
    font-size: 10px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(65px, 14vw, 110px);
    font-weight: 400;
    color: #ff9bc4;
    text-shadow: 0 0 15px #ff3687, 0 0 45px #b61d60;
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 12px #ff3687; }
    to { text-shadow: 0 0 30px #ff3687, 0 0 65px #b61d60; }
}

.subtitle {
    font-size: 11px;
    letter-spacing: 4px;
    color: #d99aaf;
    margin-top: 8px;
}

.bouquet {
    position: relative;
    width: min(340px, 90vw);
    height: 355px;
    margin: 25px auto 5px;
    animation: appear 2s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(35px); }
    to { opacity: 1; transform: translateY(0); }
}

.flower {
    position: absolute;
    width: 100px;
    height: 115px;
    transform-origin: bottom center;
    animation: sway 4s ease-in-out infinite alternate;
}

@keyframes sway {
    from { rotate: -3deg; }
    to { rotate: 3deg; }
}

.flower svg {
    width: 100%;
    overflow: visible;
    filter: drop-shadow(0 0 8px #fa347b66);
}

.flower:nth-child(1) { left: 15px; top: 55px; transform: rotate(-22deg) scale(.9); }
.flower:nth-child(2) { left: 110px; top: 5px; transform: scale(1.15); }
.flower:nth-child(3) { right: 10px; top: 55px; transform: rotate(22deg) scale(.9); }
.flower:nth-child(4) { left: 62px; top: 115px; transform: rotate(-10deg) scale(.82); }
.flower:nth-child(5) { right: 55px; top: 115px; transform: rotate(10deg) scale(.82); }

.stem {
    position: absolute;
    width: 3px;
    height: 190px;
    background: linear-gradient(#537c49, #183a25);
    left: 50%;
    top: 105px;
    transform-origin: top;
    border-radius: 10px;
    z-index: -1;
}

.wrap {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 155px;
    background: linear-gradient(120deg, #831b4d, #f35c9b, #8e194e);
    clip-path: polygon(15% 0, 85% 0, 100% 100%, 50% 77%, 0 100%);
    opacity: .9;
    filter: drop-shadow(0 0 15px #ff398566);
}

.ribbon {
    position: absolute;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 30px;
    border: 3px solid #ffb5d0;
    border-radius: 50%;
    z-index: 2;
}

.ribbon::before,
.ribbon::after {
    content: "";
    position: absolute;
    top: 15px;
    width: 37px;
    height: 43px;
    background: #ed5595;
    clip-path: polygon(0 0, 100% 0, 80% 100%, 50% 75%, 20% 100%);
}

.ribbon::before { left: -23px; transform: rotate(20deg); }
.ribbon::after { right: -23px; transform: rotate(-20deg); }

.message {
    max-width: 370px;
    margin-top: 20px;
    padding: 24px 27px;
    border: 1px solid #f15b9b66;
    border-radius: 18px;
    background: #200b17a8;
    box-shadow: 0 0 30px #e52a7540;
    backdrop-filter: blur(12px);
}

.message p {
    font-size: 17px;
    line-height: 1.8;
    color: #ffd0e1;
}

.heart {
    color: #ff5a9e;
    font-size: 24px;
    margin-top: 10px;
    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}

button {
    margin-top: 25px;
    padding: 15px 35px;
    border: 1px solid #ff80b3;
    background: #e8377d;
    color: white;
    border-radius: 30px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 20px #e8377d66;
    transition: .3s;
}

button:hover {
    background: #ff6aa7;
    box-shadow: 0 0 35px #ff4a98;
    transform: translateY(-3px);
}

.hidden-message {
    display: none;
    margin-top: 20px;
    color: #ff9bc4;
    font-family: 'Great Vibes', cursive;
    font-size: 35px;
    animation: appear 1s ease;
}

.footer {
    margin-top: 35px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #9d647c;
}

.petal {
    position: fixed;
    top: -30px;
    color: #ff6da9;
    pointer-events: none;
    z-index: 5;
    animation: falling linear forwards;
}

@keyframes falling {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media(max-width: 400px) {
    .bouquet { transform: scale(.9); margin-top: 5px; margin-bottom: 0; }
    .message { margin-top: 5px; }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<main class="container">

    <div class="top-label">✦ a little gift for you ✦</div>

    <h1>Polina</h1>
    <div class="subtitle">MY FAVORITE PERSON ♡</div>

    <div class="bouquet">

        <div class="flower">
            <svg viewBox="0 0 100 120">
                <g fill="#f44c91">
                    <ellipse cx="50" cy="28" rx="15" ry="29"/>
                    <ellipse cx="50" cy="28" rx="15" ry="29" transform="rotate(72 50 50)"/>
                    <ellipse cx="50" cy="28" rx="15" ry="29" transform="rotate(144 50 50)"/>
                    <ellipse cx="50" cy="28" rx="15" ry="29" transform="rotate(216 50 50)"/>
                    <ellipse cx="50" cy="28" rx="15" ry="29" transform="rotate(288 50 50)"/>
                </g>
                <circle cx="50" cy="50" r="14" fill="#ffb5ce"/>
                <circle cx="50" cy="50" r="7" fill="#a91d55"/>
            </svg>
        </div>

        <div class="flower">
            <svg viewBox="0 0 100 120">
                <g fill="#ff80b2">
                    <ellipse cx="50" cy="25" rx="16" ry="31"/>
                    <ellipse cx="50" cy="25" rx="16" ry="31" transform="rotate(72 50 50)"/>
                    <ellipse cx="50" cy="25" rx="16" ry="31" transform="rotate(144 50 50)"/>
                    <ellipse cx="50" cy="25" rx="16" ry="31" transform="rotate(216 50 50)"/>
                    <ellipse cx="50" cy="25" rx="16" ry="31" transform="rotate(288 50 50)"/>
                </g>
                <circle cx="50" cy="50" r="15" fill="#ffc3d9"/>
                <circle cx="50" cy="50" r="7" fill="#d22e71"/>
            </svg>
        </div>

        <div class="flower">
            <svg viewBox="0 0 100 120">
                <g fill="#d92e77">
                    <ellipse cx="50" cy="28" rx="16" ry="30"/>
                    <ellipse cx="50" cy="28" rx="16" ry="30" transform="rotate(72 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="30" transform="rotate(144 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="30" transform="rotate(216 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="30" transform="rotate(288 50 50)"/>
                </g>
                <circle cx="50" cy="50" r="14" fill="#ffb5d0"/>
                <circle cx="50" cy="50" r="7" fill="#a51d51"/>
            </svg>
        </div>

        <div class="flower">
            <svg viewBox="0 0 100 120">
                <g fill="#ff9bc4">
                    <ellipse cx="50" cy="28" rx="16" ry="29"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(72 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(144 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(216 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(288 50 50)"/>
                </g>
                <circle cx="50" cy="50" r="14" fill="#ffd0e1"/>
                <circle cx="50" cy="50" r="7" fill="#c42c6c"/>
            </svg>
        </div>

        <div class="flower">
            <svg viewBox="0 0 100 120">
                <g fill="#ec5796">
                    <ellipse cx="50" cy="28" rx="16" ry="29"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(72 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(144 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(216 50 50)"/>
                    <ellipse cx="50" cy="28" rx="16" ry="29" transform="rotate(288 50 50)"/>
                </g>
                <circle cx="50" cy="50" r="14" fill="#ffc4d9"/>
                <circle cx="50" cy="50" r="7" fill="#ad245d"/>
            </svg>
        </div>

        <div class="stem"></div>
        <div class="wrap"></div>
        <div class="ribbon"></div>

    </div>

    <div class="message">
        <p>полина, я скучала.</p>
        <div class="heart">♡</div>
    </div>

    <button onclick="openGift()">ОТКРЫТЬ ПОДАРОК ♡</button>

    <div class="hidden-message" id="secret">
        ты очень дорога мне, Полина ♡
    </div>

    <div class="footer">
        MADE WITH LOVE · JUST FOR YOU
    </div>

</main>

<script>
const stars = document.getElementById('stars');

for (let i = 0; i < 65; i++) {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = Math.random() > .5 ? '✦' : '·';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.fontSize = (Math.random() * 12 + 5) + 'px';
    star.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(star);
}

function openGift() {
    const secret = document.getElementById('secret');
    secret.style.display = 'block';

    for (let i = 0; i < 30; i++) {
        setTimeout(() => {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.textContent = ['♡', '✿', '♥', '✧'][Math.floor(Math.random() * 4)];
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = (Math.random() * 18 + 12) + 'px';
            petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(petal);

            setTimeout(() => petal.remove(), 6500);
        }, i * 100);
    }
}
</script>

</body>
</html>
